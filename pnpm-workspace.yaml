packages:
  - 'apps/*'

# Scaffold Next 16: permite somente os builds de dependência essenciais
allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  protobufjs: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - lucide-react@1.61.0
  - vite@8.3.5
