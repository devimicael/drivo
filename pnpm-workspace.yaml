packages:
  - 'apps/*'

# Scaffold Next 16: permite somente os builds de dependência essenciais
allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  protobufjs: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - material-symbols@0.48.1
  - vite@8.3.5

# Correções de segurança (pnpm audit): versões corrigidas de dependências
# transitivas (body-parser via express, multer via @nestjs/platform-express).
overrides:
  body-parser: 2.4.0
  multer: 2.5.0
