# DRIVO — orquestração: postgres:16-alpine (P-04: tag confirmada) + api + web.
# Fonte: plan.md §Strategy (ordem de geração e build).
# Ambientes: cada app tem o seu (.env da API, .env.local da Web). O Compose NÃO
# carrega .env de subpastas automaticamente — por isso o env_file explícito.
name: drivo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drivo
      POSTGRES_PASSWORD: ${DRIVO_DB_PASSWORD:-drivo}
      POSTGRES_DB: drivo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivo -d drivo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - drivo_pgdata:/var/lib/postgresql/data
    ports:
      # ⚠️ host usa 5433: nesta máquina há um serviço Windows postgres.exe
      # já escutando na 5432 (conflito). Entre containers é `postgres:5432`.
      - "5433:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      # `required: false` evita que o Compose quebre antes da validação do app.
      # Rode `pnpm setup` na raiz para criar os arquivos a partir dos .env.example.
      - path: ./apps/api/.env
        required: false
    environment:
      # Sobrescreve o .env: dentro da rede do Compose o banco é `postgres:5432`.
      NODE_ENV: production
      DATABASE_URL: postgresql://drivo:${DRIVO_DB_PASSWORD:-drivo}@postgres:5432/drivo?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* entra no bundle em build time. Browser roda no host → localhost.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    env_file:
      - path: ./apps/web/.env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  drivo_pgdata:
