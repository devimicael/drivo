# DRIVO — orquestração: postgres:16-alpine (P-04: tag confirmada) + api + web.
# Ambientes: cada app tem o seu (.env da API, .env.local da Web). O Compose NÃO
# carrega .env de subpastas automaticamente — por isso o env_file explícito.
name: drivo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drivo
      POSTGRES_PASSWORD: ${DRIVO_DB_PASSWORD:-drivo}
      POSTGRES_DB: drivo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivo -d drivo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - drivo_pgdata:/var/lib/postgresql/data
      # Cria o banco `drivo_test` no primeiro start (volume vazio). Usado pelo e2e.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # ⚠️ host usa 5433: nesta máquina há um serviço Windows postgres.exe
      # já escutando na 5432 (conflito). Entre containers é `postgres:5432`.
      - "5433:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      # `required: false` + defaults abaixo = sobe em clone limpo, sem `pnpm setup`.
      # Se o arquivo existir, os valores dele completam o ambiente (ex.: GOOGLE_API_KEY).
      - path: ./apps/api/.env
        required: false
    environment:
      # Sobrescreve o .env: dentro da rede do Compose o banco é `postgres:5432`.
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://drivo:${DRIVO_DB_PASSWORD:-drivo}@postgres:5432/drivo?schema=public
      # Avaliação local em http://localhost: Secure deixaria o login inacessível
      # em browsers que recusam cookie `Secure` fora de HTTPS. Use `true` com TLS.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Web + a própria API (Swagger em /docs).
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # Limites folgados para quem cadastra/loga várias vezes durante a avaliação.
      # Ajuste por env se quiser apertar (ex.: AUTH_THROTTLE_LIMIT=5).
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-300}
      - AUTH_THROTTLE_LIMIT=${AUTH_THROTTLE_LIMIT:-20}
      - SCAN_THROTTLE_LIMIT=${SCAN_THROTTLE_LIMIT:-10}
      # JWT_SECRET/CSRF_SECRET NÃO entram aqui: vêm de apps/api/.env quando existe.
      # Sem o arquivo, o entrypoint gera valores aleatórios por execução.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* entra no bundle em build time. Browser roda no host → localhost.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    env_file:
      - path: ./apps/web/.env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  drivo_pgdata:
